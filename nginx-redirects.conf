# nginx: put inside the server { } block for www.kivuresort.com
location ~ ^/signin/?$ { return 301 /mystay/; }
location ~ ^/register/?$ { return 301 /mystay/; }
location ~ ^/home/?$ { return 301 /; }
location ~ ^/index\.php/?$ { return 301 /; }
location ~ ^/stay/?$ { return 301 /rooms/; }
location ~ ^/dine/?$ { return 301 /restaurant/; }
location ~ ^/safaris/?$ { return 301 /tours/; }
location ~ ^/kids/?$ { return 301 /kids-park/; }
location ~ ^/msafiri/?$ { return 301 /msafiri-lodge/; }
error_page 404 /404.html;
location / { try_files $uri $uri/ =404; }
